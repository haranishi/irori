# 使うActionsは、タグでなくコミットのハッシュで固定している（乗っ取りへの備え）。
# 更新はDependabotが、ハッシュとバージョンのコメントをまとめて直すPRを出す。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # 毎週月曜（日本時間の昼）。依存の変化と、門番の劣化を拾う
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型・単体の試験・文書・権利・登録・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: node tools/check-source-files.mjs
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run deploy -w @irori/edge -- --dry-run
      - run: node tools/check-budgets.mjs --dir apps/web/dist

  e2e:
    name: 実ブラウザの通し試験（ホスト1・スマホ3）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: node tools/check-source-files.mjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e

  dev-smoke:
    name: まっさらな clone で npm run dev が棚とゲームを配れるか
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: node tools/check-source-files.mjs
      - run: npm ci --ignore-scripts
      - run: npm run smoke:dev

  mutations:
    name: mutations (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 全件を4分割し、main への反映と週1回の定期実行で流す。PRでは全件を流さない。
    if: github.event_name != 'pull_request'
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: node tools/check-source-files.mjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run mutations -- --shard ${{ matrix.shard }}/4

  deps:
    name: 依存の脆弱性とライセンス
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: node tools/check-source-files.mjs
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: node tools/check-licenses.mjs

  reuse:
    name: ライセンス表示 (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  secrets:
    name: 秘密情報と実データの走査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
